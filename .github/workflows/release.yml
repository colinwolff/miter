name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# `softprops/action-gh-release` writes the release, so the token needs contents: write.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag is the release's identity and the workspace is the source of truth for the version:
  # nothing is published before the two have been reconciled.
  verify-version:
    name: Reconcile the tag with the workspace
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve the release version
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # A manual dispatch releases whatever the checked-out ref currently holds.
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "miter-cli") | .version')"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release version: ${version}"

      - name: Every workspace crate carries the release version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          status=0
          while read -r name crate_version; do
            if [[ "${crate_version}" != "${VERSION}" ]]; then
              echo "::error::${name} is at ${crate_version}, expected ${VERSION}"
              status=1
            else
              echo "ok: ${name} ${crate_version}"
            fi
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | "\(.name) \(.version)"')
          exit "${status}"

      - name: CHANGELOG.md documents the release version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -Fq "## [${VERSION}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' heading"
            exit 1
          fi
          echo "ok: CHANGELOG.md carries a heading for ${VERSION}"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing is a diagnosis, not a reason to cancel the other three.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            rustflags: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            rustflags: "-C link-arg=-mmacosx-version-min=13.1"
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            rustflags: "-C link-arg=-mmacosx-version-min=13.1"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            rustflags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: rustup target add ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: Cache the registry and the target directory
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo build --release --locked --bin miter --target ${{ matrix.target }}
        env:
          # A *released* binary has to run on every CPU of its architecture, so the local
          # `-C target-cpu=native` (`.cargo/config.toml`) is replaced rather than inherited: a
          # runner-tuned artifact would fault on an older machine. The macOS deployment target is
          # kept, because the tree-sitter grammar objects are built against it and dropping it
          # reintroduces the linker's deployment-target warning. An *empty* `RUSTFLAGS` is still a
          # set value, which is what outranks the config's `build.rustflags`.
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --bin miter --target ${{ matrix.target }}

      - name: Package miter-v${{ needs.verify-version.outputs.version }}-${{ matrix.target }}.tar.gz
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          staging="miter-v${VERSION}-${TARGET}"
          mkdir -p "${staging}"
          cp "target/${TARGET}/release/miter" "${staging}/miter"
          cp README.md LICENSE NOTICE "${staging}/"
          # `-C` so the archive's root *is* the staging directory: `bin-dir` in
          # `[package.metadata.binstall]` is `{ bin }{ binary-ext }`, a path with no directory in
          # front of it, so the binary has to sit at the root for `cargo binstall miter-cli` to
          # find it. The zip on Windows is built the same way, from the same staging directory.
          tar -czf "${staging}.tar.gz" -C "${staging}" miter README.md LICENSE NOTICE
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          else
            shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          fi
          ls -l "${staging}.tar.gz" "${staging}.tar.gz.sha256"

      - name: Package miter-v${{ needs.verify-version.outputs.version }}-${{ matrix.target }}.zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          $staging = "miter-v$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/miter.exe" "$staging/miter.exe"
          Copy-Item README.md, LICENSE, NOTICE -Destination $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip"
          $hash = (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $staging.zip" | Out-File "$staging.zip.sha256" -Encoding ascii
          Get-ChildItem "$staging.zip*" | Format-Table Name, Length

      - name: Upload miter-${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: miter-${{ matrix.target }}
          path: miter-v${{ needs.verify-version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}*
          if-no-files-found: error

  publish-release:
    name: Publish the GitHub Release
    needs: [verify-version, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download every built archive
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the release assets
        run: ls -l dist

      - name: Publish v${{ needs.verify-version.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          # The tag is derived from the *verified* version, so a manual dispatch publishes the
          # same tag a tag push would have.
          tag_name: v${{ needs.verify-version.outputs.version }}
          name: miter v${{ needs.verify-version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          # The dash in `-alpha.1` / `-rc.1` is the whole test for a prerelease.
          prerelease: ${{ contains(needs.verify-version.outputs.version, '-') }}
          draft: false
